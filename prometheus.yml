# Prometheus для стенда LAB-01: собирает метрики CTRL.
global:
  scrape_interval: 5s      # как часто опрашивать цели
  scrape_timeout: 4s       # сколько ждать ответа (должно быть не больше интервала)

scrape_configs:
  - job_name: office-controller
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8080']
